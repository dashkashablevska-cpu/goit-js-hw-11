<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Search and explore beautiful photos from Pixabay."
    />
    <title>Image Search | Pixabay</title>
    <script type="module" crossorigin src="/vanilla-app-template/index.js"></script>
    <link rel="modulepreload" crossorigin href="/vanilla-app-template/assets/vendor-CqoLp5UU.js">
    <link rel="stylesheet" crossorigin href="/vanilla-app-template/assets/vendor-DumFYO8Z.css">
    <link rel="stylesheet" crossorigin href="/vanilla-app-template/assets/styles-B4xvuHDL.css">
  </head>

  <body>
    <main class="container">
      <h1 class="visually-hidden">Pixabay Image Search</h1>

      <form class="form">
        <label class="visually-hidden" for="search-input">
          Search images
        </label>

        <input
          id="search-input"
          class="search-input"
          type="text"
          name="search-text"
          placeholder="Search images..."
          autocomplete="off"
          required
        />

        <button class="search-button" type="submit">Search</button>
      </form>

      <div class="loader-container is-hidden" role="status" aria-live="polite">
        <span class="loader" aria-hidden="true"></span>
        <p class="loader-text">Loading images, please wait...</p>
      </div>

      <ul class="gallery"></ul>
    </main>

  </body>
</html>
